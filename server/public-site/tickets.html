<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soporte / Tickets | CDCom Comunicaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --bg: #020617;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: linear-gradient(165deg, #0f172a, #020617);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 20px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      }
      .logo { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
      .logo strong { color: var(--text); }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: var(--muted); font-size: 15px; margin: 0 0 24px; line-height: 1.5; }
      .btn {
        display: inline-block;
        border-radius: 999px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        border: none;
        margin: 6px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 40px rgba(37, 99, 235, 0.5);
      }
      .btn-outline {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.6);
      }
      .btn-outline:hover { background: rgba(15, 23, 42, 0.8); }
      .links { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(148, 163, 184, 0.25); }
      .links a { color: #38bdf8; font-size: 14px; text-decoration: none; }
      .links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><strong>CDCom Comunicaciones</strong> · Internet · PtP · WiFi</div>
      <h1>🎫 Soporte y tickets</h1>
      <p>Para abrir un ticket de soporte, consultar el estado de tu solicitud o chatear con nosotros, ingresa a tu cuenta del portal de cliente.</p>
      <a href="/portal/login" class="btn btn-primary">Ingresar a mi cuenta</a>
      <br />
      <a href="https://wa.me/523151259871" class="btn btn-outline" target="_blank" rel="noopener noreferrer">Soporte por WhatsApp</a>
      <div class="links">
        <a href="/">← Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
